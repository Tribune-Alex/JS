<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Color Picker</title>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>Let's play color picker</h1>
        </div>
        <div id="box">
            <div class="answer">
                
            </div>
            <div id="table">
                <div class="dashboard">
                    <label>Level</label>
                    <div id="level"></div>
                    <label>Score</label>
                    <div id="score"></div>
                    <label>Life</label>
                    <div id="lifes"></div>
                    <label>Correct Choices</label>
                    <div id="correctans"></div>
                    <label>Gues the color</label>
                    <div id="currentcolor"><span id="target"></span></div>
                </div>


                <div id="buttons">
                    <button type="button" class="but" id="easy">Easy</button>
                    <button type="button" class="but" id="medium">Medium</button>
                    <button type="button" class="but" id="hard">Hard</button>
                </div>

                <div class="startover">
                    <button id="start" type="button">Start/Over</button>
                </div>
            </div>

            <div class="game"></div>
        </div>
    </div>
    <script src="./script.js"></script>
</body>

</html>
