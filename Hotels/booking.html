<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        .main {
            display: flex;
            flex-wrap: nowrap;
            gap: 20px;

        }

        /* * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        } */

        body {
            background: #f4f6f9;
            min-height: 100vh;
        }

        .booking-container {
            width: 420px;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, .15);
        }

        .booking-container h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #333;
        }

        .input-group {
            margin-bottom: 18px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #555;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            outline: none;
            transition: .3s;
            font-size: 16px;
        }

        .input-group input:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 5px rgba(13, 110, 253, .3);
        }

        button {
            width: 100%;
            padding: 14px;
            background: #0d6efd;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 17px;
            cursor: pointer;
            transition: .3s;
        }

        button:hover {
            background: #0b5ed7;
        }

        @media(max-width:500px) {
            .booking-container {
                width: 90%;
                padding: 20px;
            }
        }
    </style>
</head>

<body>
    <section class="header" id="sec">
        <nav class="navbar navbar-expand-lg bg-body-tertiary">
            <div class="container-fluid">
                <button onclick="backToMain()" type="button" class="btn btn-primary">Main</button>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
                    aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link" href="#">Link</a>
                        </li>
                </div>
            </div>
        </nav>
    </section>
    <section class="main">
        <div id="rooms"></div>
        <div id="form">
            <div class="booking-container">
                <h2>Room Booking</h2>

                <form id="bookingForm">

                    <div class="input-group">
                        <label for="name">Name</label>
                        <input type="text" id="name" placeholder="Enter your name" required>
                    </div>

                    <div class="input-group">
                        <label for="phone">Phone Number</label>
                        <input type="tel" id="phone" placeholder="+995 555 12 34 56" required>
                    </div>

                    <div class="input-group">
                        <label for="checkIn">Date In</label>
                        <input type="date" id="checkIn" required>
                    </div>

                    <div class="input-group">
                        <label for="checkOut">Date Out</label>
                        <input type="date" id="checkOut" required>
                    </div>

                    <button type="button" id="but">Book</button>

                </form>
            </div>
        </div>
    </section>
    <script src="./booking.js"></script>
</body>

</html>
