<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
</head>

<body>
    <section class="main">
        <div class="agecount">
            <h2>დავალება 1 – ასაკის გამოთვლა</h2>
            <div class="inputform">
                <form>
                    <label for="date-picker">Input Date Of Birth:</label>
                    <input type="text" id="date-picker" placeholder="Choose a date...">
                </form>
                <div id="result"></div>
            </div>
        </div>

        <div class="countdown">
            <h2>დავალება 2 – Countdown</h2>
            <div class="inputform2">
                <form>
                    <label for="date-picker">Input Date:</label>
                    <input type="text" id="date-picker2" placeholder="Choose a date...">
                </form>
                <div id="results"></div>
        </div>

        <div class="workingday">
            <h2>დავალება 3 – სამუშაო დღე</h2>
            <div class="inputform3">
                <form>
                    <label for="date-picker">Input Date:</label>
                    <input type="text" id="date-picker3" placeholder="Choose a date...">
                </form>
                <div id="resultday"></div>
        </div>
    </section>
    <script src="./script.js"></script>
</body>

</html>
